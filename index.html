<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Firma del Cliente</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.6/dist/signature_pad.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #222222);
    display: flex; flex-direction: column;
  }
  h1 {
    font-size: 18px;
    text-align: center;
    margin: 14px 10px 4px;
  }
  p.sub {
    text-align: center;
    font-size: 13px;
    color: #777;
    margin: 0 10px 10px;
  }
  #contenedor-firma {
    flex: 1;
    margin: 0 12px 12px;
    border: 2px dashed #bbb;
    border-radius: 10px;
    position: relative;
    min-height: 220px;
    background: #fff;
  }
  #canvas-firma {
    width: 100%;
    height: 100%;
    touch-action: none;
    border-radius: 8px;
  }
  #placeholder {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #ccc;
    font-size: 14px;
    pointer-events: none;
  }
  .botones {
    display: flex;
    gap: 10px;
    padding: 0 12px 16px;
  }
  button {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #btn-limpiar {
    background: #eee;
    color: #444;
  }
  #btn-confirmar {
    background: var(--tg-theme-button-color, #2563eb);
    color: var(--tg-theme-button-text-color, #ffffff);
  }
  #btn-confirmar:disabled {
    opacity: 0.5;
  }
  #aviso {
    text-align: center;
    font-size: 12px;
    color: #c0392b;
    min-height: 16px;
    margin: 0 12px 6px;
  }
</style>
</head>
<body>
  <h1>Firma del Cliente</h1>
  <p class="sub">Firme con el dedo dentro del recuadro</p>

  <div id="contenedor-firma">
    <canvas id="canvas-firma"></canvas>
    <div id="placeholder">Firme aquí ✍️</div>
  </div>

  <div id="aviso"></div>

  <div class="botones">
    <button id="btn-limpiar" type="button">Borrar</button>
    <button id="btn-confirmar" type="button" disabled>Confirmar firma</button>
  </div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  const canvas = document.getElementById('canvas-firma');
  const placeholder = document.getElementById('placeholder');
  const avisoEl = document.getElementById('aviso');
  const btnLimpiar = document.getElementById('btn-limpiar');
  const btnConfirmar = document.getElementById('btn-confirmar');

  function ajustarCanvas() {
    const ratio = Math.max(window.devicePixelRatio || 1, 1);
    const contenedor = document.getElementById('contenedor-firma');
    canvas.width = contenedor.clientWidth * ratio;
    canvas.height = contenedor.clientHeight * ratio;
    canvas.getContext('2d').scale(ratio, ratio);
    firmaPad.clear();
  }

  const firmaPad = new SignaturePad(canvas, {
    backgroundColor: 'rgba(255,255,255,1)',
    penColor: '#111111',
    minWidth: 1.2,
    maxWidth: 2.6,
  });

  firmaPad.addEventListener('beginStroke', () => {
    placeholder.style.display = 'none';
  });
  firmaPad.addEventListener('endStroke', () => {
    btnConfirmar.disabled = firmaPad.isEmpty();
  });

  window.addEventListener('resize', ajustarCanvas);
  ajustarCanvas();

  btnLimpiar.addEventListener('click', () => {
    firmaPad.clear();
    placeholder.style.display = 'block';
    btnConfirmar.disabled = true;
    avisoEl.textContent = '';
  });

  btnConfirmar.addEventListener('click', () => {
    if (firmaPad.isEmpty()) {
      avisoEl.textContent = 'Debe firmar antes de confirmar.';
      return;
    }
    const dataUrl = firmaPad.toDataURL('image/png');
    const base64 = dataUrl.split(',')[1];

    if (!tg) {
      avisoEl.textContent = 'Esta página debe abrirse desde el bot de Telegram.';
      return;
    }
    try {
      tg.sendData(JSON.stringify({ tipo: 'firma_cliente', imagen_base64: base64 }));
      tg.close();
    } catch (e) {
      avisoEl.textContent = 'No se pudo enviar la firma. Intente de nuevo.';
    }
  });
</script>
</body>
</html>
