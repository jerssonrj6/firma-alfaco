<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Firma del Cliente</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #222222);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  h1 { font-size: 20px; margin: 4px 0; text-align: center; }
  p.sub { margin: 0 0 12px 0; color: #888; font-size: 14px; text-align: center; }
  #canvasWrap {
    border: 2px dashed #bbb;
    border-radius: 8px;
    width: 100%;
    max-width: 400px;
    touch-action: none;
  }
  canvas {
    width: 100%;
    display: block;
    touch-action: none;
    background: #ffffff;
    border-radius: 6px;
  }
  .botones {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 400px;
    margin-top: 16px;
  }
  button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  #btnBorrar { background: #eee; color: #333; }
  #btnConfirmar { background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }
  #btnConfirmar:disabled { opacity: 0.5; }
  #estado { margin-top: 10px; font-size: 14px; min-height: 20px; text-align: center; }
  #estado.error { color: #d33; }
  #estado.ok { color: #2a2; }
</style>
</head>
<body>
  <h1>Firma del Cliente</h1>
  <p class="sub">Firme con el dedo dentro del recuadro</p>

  <div id="canvasWrap">
    <canvas id="pad" width="400" height="500"></canvas>
  </div>

  <div class="botones">
    <button id="btnBorrar">Borrar</button>
    <button id="btnConfirmar">Confirmar firma</button>
  </div>

  <div id="estado"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const canvas = document.getElementById('pad');
const ctx = canvas.getContext('2d');
ctx.lineWidth = 3;
ctx.lineCap = 'round';
ctx.lineJoin = 'round';
ctx.strokeStyle = '#000000';

// Ancho lógico fijo (400x500). El canvas se escala visualmente con CSS
// pero los puntos que guardamos siempre están en este sistema de coordenadas,
// así que del lado del bot sabemos exactamente cómo reconstruir el dibujo.
const LOGICAL_W = 400;
const LOGICAL_H = 500;

let strokes = [];      // array de trazos; cada trazo es un array de [x,y]
let currentStroke = null;
let drawing = false;

function getPos(evt) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = LOGICAL_W / rect.width;
  const scaleY = LOGICAL_H / rect.height;
  const point = evt.touches ? evt.touches[0] : evt;
  const x = (point.clientX - rect.left) * scaleX;
  const y = (point.clientY - rect.top) * scaleY;
  return [Math.round(x), Math.round(y)];
}

function start(evt) {
  evt.preventDefault();
  drawing = true;
  currentStroke = [];
  strokes.push(currentStroke);
  const [x, y] = getPos(evt);
  currentStroke.push([x, y]);
  ctx.beginPath();
  ctx.moveTo(x * canvas.width / LOGICAL_W, y * canvas.height / LOGICAL_H);
  setEstado('');
}

function move(evt) {
  if (!drawing) return;
  evt.preventDefault();
  const [x, y] = getPos(evt);
  currentStroke.push([x, y]);
  ctx.lineTo(x * canvas.width / LOGICAL_W, y * canvas.height / LOGICAL_H);
  ctx.stroke();
}

function end(evt) {
  drawing = false;
}

canvas.addEventListener('mousedown', start);
canvas.addEventListener('mousemove', move);
window.addEventListener('mouseup', end);
canvas.addEventListener('touchstart', start, { passive: false });
canvas.addEventListener('touchmove', move, { passive: false });
canvas.addEventListener('touchend', end);

document.getElementById('btnBorrar').addEventListener('click', () => {
  strokes = [];
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  setEstado('');
});

function setEstado(msg, tipo) {
  const el = document.getElementById('estado');
  el.textContent = msg;
  el.className = tipo || '';
}

// Codifica los trazos en un string compacto: "W,H|x,y;x,y;...|x,y;x,y;..."
// (mucho más liviano que JSON: sin comillas ni llaves)
function codificar(strokesData) {
  const cuerpo = strokesData
    .filter(s => s.length > 0)
    .map(s => s.map(p => p[0] + ',' + p[1]).join(';'))
    .join('|');
  return LOGICAL_W + ',' + LOGICAL_H + '|' + cuerpo;
}

// Si el resultado pesa más de ~4000 bytes (límite de Telegram = 4096),
// vamos reduciendo puntos (nos quedamos con 1 de cada N) hasta que quepa.
function codificarConLimite(strokesData, limiteBytes) {
  let paso = 1;
  while (paso <= 20) {
    const reducidos = strokesData.map(s =>
      paso === 1 ? s : s.filter((_, i) => i % paso === 0 || i === s.length - 1)
    );
    const texto = codificar(reducidos);
    if (new TextEncoder().encode(texto).length <= limiteBytes) {
      return texto;
    }
    paso++;
  }
  // último recurso: solo los puntos extremos de cada trazo
  const minimos = strokesData.map(s => [s[0], s[s.length - 1]]);
  return codificar(minimos);
}

document.getElementById('btnConfirmar').addEventListener('click', () => {
  const trazosValidos = strokes.filter(s => s.length > 0);
  if (trazosValidos.length === 0) {
    setEstado('Por favor firme antes de confirmar.', 'error');
    return;
  }

  const texto = codificarConLimite(trazosValidos, 4000);

  if (!tg) {
    setEstado('Esta página debe abrirse dentro de Telegram.', 'error');
    return;
  }

  try {
    tg.sendData(texto);
    setEstado('Firma enviada ✅', 'ok');
    // Telegram cierra la Mini App automáticamente tras sendData(),
    // pero por si acaso lo forzamos también:
    setTimeout(() => tg.close(), 300);
  } catch (err) {
    setEstado('No se pudo enviar la firma. Intente de nuevo.', 'error');
  }
});
</script>
</body>
</html>
